debug=2
log_stderror=yes
memdbg=5
memlog=5
log_facility=LOG_LOCAL0
children=2
auto_aliases=no

alias="SIP_DOMAIN"
alias="localhost"
alias="127.0.0.1"


listen=udp:0.0.0.0:5060 advertise ADVERTISED_IP:5060
listen=tcp:0.0.0.0:5060 advertise ADVERTISED_IP:5060

mhomed=0
tcp_connection_lifetime=3605
tcp_max_connections=2048

loadmodule "db_mysql.so"
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "ctl.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "nathelper.so"
loadmodule "counters.so"



modparam("jsonrpcs", "pretty_format", 1)
modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")

modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)


modparam("usrloc", "db_url", "DBURL")
modparam("usrloc", "db_mode", 2)
modparam("usrloc", "use_domain", 0)
modparam("usrloc", "timer_interval", 60)
modparam("usrloc", "timer_procs", 1)

modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "default_expires", 600)
modparam("registrar", "gruu_enabled", 0)


modparam("auth_db", "db_url", "DBURL")
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "load_credentials", "")
modparam("auth_db", "use_domain", 0)

modparam("usrloc", "version_table", 0)
modparam("auth_db", "version_table", 0)


modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_from", "sip:pinger@SIP_DOMAIN")


request_route {
    route(REQINIT);

    
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            if (is_first_hop()) {
                set_contact_alias();
            }
        }
        setflag(FLT_NATS);
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    t_check_trans();

    if (is_method("INVITE")) {
        record_route();
    }

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "Keepalive");
        exit;
    }


    if (is_method("INVITE|MESSAGE|SUBSCRIBE|PUBLISH")) {
        if (!proxy_authorize("SIP_DOMAIN", "subscriber")) {
            proxy_challenge("SIP_DOMAIN", "0");
            exit;
        }
        consume_credentials();
    }

    route(LOCATION);
}


route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp — dropped\n");
        exit;
    }

    xlog("L_INFO", "SIP $rm from $fu (src=$si:$sp) r-uri=$ru\n");
}


route[REGISTRAR] {
    if (!is_method("REGISTER")) {
        return;
    }

    xlog("L_INFO", "REGISTER for $tu from $si:$sp\n");

    if (!www_authorize("SIP_DOMAIN", "subscriber")) {
        www_challenge("SIP_DOMAIN", "0");
        exit;
    }

    consume_credentials();

    if (isflagset(FLT_NATS)) {
        setbflag(FLB_NATB);
    }

    if (!save("location")) {
        sl_reply_error();
        exit;
    }

    xlog("L_INFO", "REGISTER ok for $tu\n");
    exit;
}


route[LOCATION] {
    if (!lookup("location")) {
        $var(rc) = $rc;
        t_newtran();
        switch ($var(rc)) {
            case -1:
            case -3:
                sl_send_reply("404", "Not Found / Not Registered");
                exit;
            case -2:
                sl_send_reply("405", "Method Not Allowed");
                exit;
        }
    }

   
    if (!handle_ruri_alias()) {
        xlog("L_DBG", "handle_ruri_alias: no alias on $ru\n");
    }

    xlog("L_INFO", "Lookup OK — relaying $rm to $ru (dst=$dd:$dp)\n");
    route(RELAY);
}


route[WITHINDLG] {
    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                xlog("L_INFO", "BYE — call ending\n");
            }
            if (is_method("ACK")) {
                route(NATMANAGE);
            } else if (isflagset(FLT_NATS)) {
                route(NATMANAGE);
            }
            route(RELAY);
            exit;
        }

        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }
            exit;
        }

        sl_send_reply("404", "Not here");
        exit;
    }
}


route[RELAY] {
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
        if (!t_is_set("branch_route")) {
            t_on_branch("MANAGE_BRANCH");
        }
    }

    if (is_method("INVITE")) {
        if (!t_is_set("onreply_route")) {
            t_on_reply("MANAGE_REPLY");
        }
        if (!t_is_set("failure_route")) {
            t_on_failure("MANAGE_FAILURE");
        }
        route(NATMANAGE);
    }

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[NATMANAGE] {
    if (is_request()) {
        if (has_totag()) {
            if (check_route_param("nat=yes")) {
                set_contact_alias();
            }
            return;
        }
        if (isflagset(FLT_NATS)) {
            add_rr_param(";nat=yes");
        }
    }
    if (is_reply()) {
        if (isbflagset(FLB_NATB)) {
            if (is_first_hop()) {
                set_contact_alias();
            }
        }
    }
    return;
}


branch_route[MANAGE_BRANCH] {
    xlog("L_INFO", "New branch: $ru -> $du\n");
    route(NATMANAGE);
}

onreply_route[MANAGE_REPLY] {
    xlog("L_INFO", "Reply $rs $rr for $rm\n");
    route(NATMANAGE);
}

failure_route[MANAGE_FAILURE] {
    xlog("L_WARN", "Failure for $rm to $ru — code=$T(reply_code)\n");
    if (t_is_canceled()) {
        exit;
    }
}
